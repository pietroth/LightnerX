name: C++17 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        configuration: [Debug, Release]
        include:
          - compiler: gcc
            configuration: Debug
            sanitizers: address,undefined
    steps:
      - name: Install toolchain and dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl g++-14 clang-19 ninja-build python3-venv libssl-dev libprotobuf-dev protobuf-compiler pkg-config
          python3 -m venv /opt/lightnerx-tools
          /opt/lightnerx-tools/bin/pip install cmake==3.22.0
          echo /opt/lightnerx-tools/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        shell: bash
        env:
          COMPILER: ${{ matrix.compiler }}
          CONFIGURATION: ${{ matrix.configuration }}
          SANITIZERS: ${{ matrix.sanitizers }}
        run: |
          if [ "$COMPILER" = gcc ]; then
            export CC=gcc-14 CXX=g++-14
          else
            export CC=clang-19 CXX=clang++-19
          fi
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE="$CONFIGURATION" -DLIGHTNERX_BUILD_TESTS=ON -DLIGHTNERX_SANITIZERS="$SANITIZERS"
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/ci --output-on-failure --output-junit results.xml --output-log build/ci/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.configuration }}
          path: |
            build/ci/results.xml
            build/ci/tests.log
            build/ci/Testing/Temporary/LastTest.log

  native-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lightnerx-reference
          create-args: >-
            gcc_linux-64=15.2.0 gxx_linux-64=15.2.0
            libgcc=15.2.0 libstdcxx=15.2.0
            cmake=4.5.0 ninja=1.13.2 libprotobuf=3.21.12 openssl=3.6.5 python=3.12 pip
          cache-environment: true
      - name: Build and test original C++26 revision
        shell: micromamba-shell {0}
        run: |
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          export CC="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
          export CXX="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++"
          python -m venv build/cmake-reference
          build/cmake-reference/bin/pip install cmake==4.2.3
          git worktree add --detach build/reference 541ae1d39225ec9b747b9f888f96242a710e9073
          git -C build/reference submodule update --init --recursive
          build/cmake-reference/bin/cmake -S build/reference -B build/reference-build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLIGHTNERX_BUILD_TESTS=ON
          build/cmake-reference/bin/cmake --build build/reference-build --parallel 2
          build/cmake-reference/bin/ctest --test-dir build/reference-build --output-on-failure --output-junit results.xml --output-log build/reference-build/tests.log
      - name: Compare expected implementations and original wire behavior
        shell: micromamba-shell {0}
        run: |
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          export CC="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
          export CXX="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++"
          python -m venv build/cmake-minimum
          build/cmake-minimum/bin/pip install cmake==3.22.0
          export PATH="$PWD/build/cmake-minimum/bin:$PATH"
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLIGHTNERX_BUILD_TESTS=ON -DLIGHTNERX_BUILD_NATIVE_REFERENCE_TESTS=ON -DLIGHTNERX_REFERENCE_BINARY="$PWD/build/reference-build/tests/lightnerx_test_lifecycle"
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure --output-junit results.xml --output-log build/native/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reference
          path: |
            build/reference-build/results.xml
            build/reference-build/tests.log
            build/native/results.xml
            build/native/tests.log
            build/native/Testing/Temporary/LastTest.log
